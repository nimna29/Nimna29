# Builds the live profile telemetry (stats, streak, languages) and the
# contribution snake, then publishes everything to the `telemetry` branch that
# README.md reads images from.
#
# It deliberately uses its own `telemetry` branch (not `output`): the old
# snake-only workflow force-pushes `output` and would wipe the stats cards.
name: Update profile telemetry

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (runs from the default branch)
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Optional: add a classic PAT with `read:user` + `repo` as the
      # METRICS_TOKEN secret to include private contributions.
      - name: Generate telemetry cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/deck_stats.py --user "${{ github.repository_owner }}" --out dist

      # Raw snake only - deck_snake.py re-themes it to the deck palette below.
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b33,#1e3a8a,#2563eb,#6366f1,#a78bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-themes the snake and mounts it in a deck panel. Writes a placeholder
      # panel instead if the snake step produced nothing.
      - name: Mount the snake in a deck panel
        if: always()
        run: python3 scripts/deck_snake.py dist/github-contribution-grid-snake-dark.svg dist/deck-snake.svg

      - name: Publish to telemetry branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: telemetry
          build_dir: dist
          commit_message: Update profile telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
